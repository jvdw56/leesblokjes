<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>LeesBlokjes - leesmodustests</title>
</head>
<body>
  <h1>Leesmodustests</h1>
  <pre id="results">Tests worden uitgevoerd...</pre>
  <iframe id="app" title="LeesBlokjes testapp" style="width: 100%; height: 800px;"></iframe>
  <script>
    (async () => {
      const frame = document.getElementById('app');
      const results = document.getElementById('results');
      const keys = ['leesblokjes_leesprofiel', 'leesblokjes_instellingen',
        'leesblokjes_actieve_import_sectie', 'leesblokjes_laatste_geopende_sectie',
        'leesblokjes_paneel_ingeklapt'];
      const saved = keys.map(key => localStorage.getItem(key));
      const checks = [];
      function assert(condition, message) {
        if (!condition) throw new Error(message);
        checks.push(`PASS: ${message}`);
      }
      function loadApp() {
        return new Promise((resolve, reject) => {
          frame.onload = () => {
            if (!frame.contentWindow.LeesBlokjes) {
              reject(new Error('LeesBlokjes API is niet geladen'));
              return;
            }
            resolve(frame.contentWindow);
          };
          frame.src = '../index.html';
        });
      }
      try {
        keys.forEach(key => localStorage.removeItem(key));
        let app = await loadApp();
        let doc = app.document;
        const api = app.LeesBlokjes;
        const choose = mode => doc.querySelector(`[data-reading-mode="${mode}"]`).click();
        const isMode = (document, mode) =>
          document.querySelector(`[data-reading-mode="${mode}"]`).getAttribute('aria-pressed') === 'true';
        const content = () => doc.querySelector('.blokje-content');
        assert(isMode(doc, 'syllables'),
          'Lettergreepmodus is standaard');
        assert(api.getActiveImportSection() === 'text', 'Tekst plakken is standaard open');
        assert(doc.querySelector('.input-card').firstElementChild.matches('.import-navigation') &&
          doc.querySelectorAll('.import-navigation button').length === 4 &&
          !doc.querySelector('.accordion-item'), 'Vier bronknoppen boven de invoer, zonder accordeons');
        for (const source of ['doc', 'web', 'bookmarklet', 'text']) {
          doc.getElementById(`tab-btn-${source}`).click();
          const visible = doc.querySelectorAll('.import-panel:not([hidden])');
          assert(visible.length === 1 && visible[0].id === `import-panel-${source}` &&
            visible[0].parentElement === doc.querySelector('.input-card'),
            `Precies een paneel direct onder bronknoppen: ${source}`);
          assert(doc.querySelectorAll('.import-navigation [aria-pressed="true"]').length === 1,
            `Precies een actieve bronknop: ${source}`);
          doc.getElementById(`tab-btn-${source}`).click();
          assert(api.getActiveImportSection() === source, `Herhaald klikken sluit ${source} niet`);
          assert(localStorage.getItem(keys[2]) === source, `Bronkeuze wordt opgeslagen: ${source}`);
        }
        assert(doc.querySelectorAll('.web-suggestions [data-url]').length === 2 &&
          Array.from(doc.querySelectorAll('.web-suggestions [data-url]'))
            .every(button => button.dataset.url.startsWith('https://nl.wikipedia.org/wiki/')) &&
          !/Jeugdjournaal|Nu\.nl/.test(doc.getElementById('import-panel-web').textContent),
          'Alleen Wikipedia-voorbeelden, geen geblokkeerde nieuwssites');
        const badgeStyle = app.getComputedStyle(doc.querySelector('#tab-btn-bookmarklet .badge-beta-tag'));
        const dyslexiaBadgeStyle = app.getComputedStyle(doc.querySelector('.experimental-divider .badge-beta-tag'));
        assert(badgeStyle.backgroundColor === dyslexiaBadgeStyle.backgroundColor &&
          badgeStyle.color === dyslexiaBadgeStyle.color && badgeStyle.borderColor === dyslexiaBadgeStyle.borderColor &&
          doc.querySelector('.experimental-divider').textContent.includes('Dyslexiemodus'),
          'Dyslexiemodus heeft dezelfde oranje BETA-badge als websites');
        const groups = [
          ['green', 'a e i o u'],
          ['yellow', 'aa ee oo uu'],
          ['orange', 'ij ei ou au ie oe eu ui'],
          ['white', 'aai ooi oei eeuw ieuw uw'],
          ['blue', 'b c d f g h j k l m n p q r s t v w x y z ng nk ch sch schr str br']
        ];
        for (const [color, words] of groups) {
          for (const word of words.split(' ')) {
            for (const input of [word, word.toUpperCase()]) {
              const tokens = api.splitDutchSounds(input);
              assert(tokens.length === 1 && tokens[0].text === input && tokens[0].color === color,
                `Exacte klankgroep en kleur: ${input} (${color})`);
            }
          }
        }
        const examples = [
          ['schroef', ['schr', 'oe', 'f']],
          ['kraai', ['kr', 'aai']],
          ['sneeuw', ['sn', 'eeuw']],
          ['nieuw', ['n', 'ieuw']],
          ['duw', ['d', 'uw']],
          ['bank', ['b', 'a', 'nk']],
          ['zingen', ['z', 'i', 'ng', 'e', 'n']]
        ];
        for (const [word, expected] of examples) {
          assert(JSON.stringify(api.splitDutchSounds(word).map(group => group.text)) === JSON.stringify(expected),
            `Langste groep eerst: ${word}`);
        }
        const requiredExamples = [
          ['school', ['sch', 'oo', 'l'], ['blue', 'yellow', 'blue']],
          ['schrijf', ['schr', 'ij', 'f'], ['blue', 'orange', 'blue']],
          ['schrijfboek', ['schr', 'ij', 'f', 'b', 'oe', 'k'], ['blue', 'orange', 'blue', 'blue', 'orange', 'blue']],
          ['nieuws', ['n', 'ieuw', 's'], ['blue', 'white', 'blue']],
          ['leeuw', ['l', 'eeuw'], ['blue', 'white']],
          ['vriendelijk', ['vr', 'ie', 'n', 'd', 'e', 'l', 'ij', 'k'],
            ['blue', 'orange', 'blue', 'blue', 'green', 'blue', 'orange', 'blue']],
          ['ruimteschip', ['r', 'ui', 'm', 't', 'e', 'sch', 'i', 'p'],
            ['blue', 'orange', 'blue', 'blue', 'green', 'blue', 'green', 'blue']]
        ];
        doc.getElementById('toggle-show-syllables').click();
        doc.getElementById('toggle-color-syllables').click();
        for (const [word, expected, colors] of requiredExamples) {
          doc.getElementById('text-input').value = word;
          choose('syllables');
          const before = content().innerHTML;
          choose('sounds');
          const rendered = Array.from(content().querySelectorAll('.sound'));
          assert(JSON.stringify(rendered.map(group => group.textContent)) === JSON.stringify(expected),
            `Zichtbare klankbouwstenen direct na moduskeuze: ${word}`);
          assert(rendered.every((group, index) => group.classList.contains(`sound-${colors[index]}`) &&
            app.getComputedStyle(group).backgroundColor !== 'rgba(0, 0, 0, 0)'),
            `Elke klankgroep heeft de juiste zichtbare kleur: ${word}`);
          assert(content().innerHTML !== before && !content().querySelector('.syl') &&
            content().textContent === word &&
            Array.from(content().querySelector('.sound-word').childNodes).every(node => node.nodeType === 1),
            `Geen gewone woordtekst of lettergrepen in klankuitvoer: ${word}`);
          assert(doc.querySelectorAll('[data-reading-mode][aria-pressed="true"]').length === 1,
            `Leesmodi zijn wederzijds exclusief: ${word}`);
          doc.getElementById('btn-convert').click();
          assert(content().innerHTML.includes('sound-'), `Conversieknop behoudt Klankmodus: ${word}`);
        }
        doc.getElementById('text-input').value = 'nieuws';
        choose('sounds');
        assert(content().textContent === 'nieuws' && content().querySelector('.sound-dots'),
          'Opnieuw kiezen bouwt gewijzigde invoer op, niet verouderde uitvoer');
        doc.getElementById('btn-sample').click();
        assert(content().querySelector('.sound') && !content().querySelector('.syl'),
          'Voorbeeldverhaal gebruikt de actieve Klankmodus');
        api.importText({ text: 'school schrijfboek nieuws leeuw vriendelijk ruimteschip', title: 'Test' });
        assert(content().querySelectorAll('.sound-word').length === 6 && !content().querySelector('.syl'),
          'Geimporteerde tekst gebruikt overal klankbouwstenen');
        const originalExtract = api.DocumentProcessor.extractText;
        try {
          api.DocumentProcessor.extractText = async () => ({
            text: 'school nieuws leeuw', fileName: 'test.docx', wordCount: 3, isScannedOrEmpty: false
          });
          await api.handleFileUpload(new app.File(['test'], 'test.docx'));
          assert(content().querySelectorAll('.sound-word').length === 3 &&
            content().querySelectorAll('.sound-dots').length === 2,
            'Documentupload gebruikt de actieve Klankmodus');
        } finally {
          api.DocumentProcessor.extractText = originalExtract;
        }
        doc.getElementById('btn-clear').click();
        choose('syllables');
        doc.getElementById('btn-reset-profile').click();
        const text = "Nederland kraai sneeuw nieuw duw! AAI OOI OEI EEUW IEUW UW.\n'zomer' zee-egel café <img src=x> & 123.";
        api.renderBlocks([text]);
        const syllableHtml = content().innerHTML;
        assert(content().querySelector('.syl') !== null, 'Bestaande lettergreepbouwstenen bestaan');
        choose('sounds');
        assert(content().textContent === text, 'Tekst, hoofdletters, leestekens en spaties blijven exact behouden');
        assert(content().querySelector('img') === null, 'HTML uit invoer wordt niet uitgevoerd');
        assert(!doc.body.classList.contains('show-syllables') && !doc.body.classList.contains('color-syllables'),
          'Klankmodus is onafhankelijk van lettergreepkleuren');
        assert(doc.getElementById('syllable-options').hidden && !doc.getElementById('sound-mode-info').hidden,
          'Alleen de instellingen van de actieve modus worden getoond');
        assert(content().querySelectorAll('.sound-underline').length === 4,
          'Alle aai/ooi/oei-groepen hebben onderstreping');
        assert(content().querySelectorAll('.sound-dots').length === 6,
          'Alle eeuw/ieuw/uw-groepen hebben puntmarkeringen');
        content().querySelectorAll('.sound-dots').forEach(group => {
          assert(group.querySelectorAll('.sound-letter').length === group.textContent.length,
            `Een punt per letter: ${group.textContent}`);
        });
        const underline = content().querySelector('.sound-underline');
        const lineStyle = app.getComputedStyle(underline, '::after');
        assert(parseFloat(lineStyle.borderTopWidth) > 0 && parseFloat(lineStyle.borderBottomWidth) > 0 &&
          lineStyle.borderTopStyle === 'solid' && lineStyle.borderBottomStyle === 'solid',
          'Onderstreping bestaat visueel uit twee lijnen');
        const dotStyle = app.getComputedStyle(content().querySelector('.sound-letter'), '::after');
        assert(dotStyle.width === '3px' && dotStyle.height === '3px' && dotStyle.content !== 'none',
          'Punten zijn zichtbare CSS-markeringen zonder extra tekst');
        const accent = api.splitDutchSounds('é')[0];
        assert(accent.text === 'é' && accent.color === null, 'Onbekende letters krijgen geen verzonnen klankkleur');
        assert(JSON.stringify(api.splitDutchSounds('İAA').map(group => [group.text, group.color])) ===
          JSON.stringify([['İ', null], ['AA', 'yellow']]),
          'Unicode-hoofdletters veranderen geen indices of klankgroepen');
        assert(doc.querySelector('.lees-blokje').dataset.originalText === text,
          'Originele tekst voor kopieren en voorlezen blijft intact');
        const normalColors = Array.from(content().querySelectorAll('.sound')).map(group => app.getComputedStyle(group).backgroundColor);
        doc.getElementById('theme-donker').click();
        assert(JSON.stringify(normalColors) === JSON.stringify(
          Array.from(content().querySelectorAll('.sound')).map(group => app.getComputedStyle(group).backgroundColor)),
          'Klankkleuren blijven gelijk in donker thema');
        choose('syllables');
        assert(content().innerHTML === syllableHtml, 'Terugwisselen herstelt exact de bestaande lettergreepopmaak');
        doc.getElementById('toggle-show-syllables').click();
        doc.getElementById('toggle-color-syllables').click();
        const showBefore = doc.getElementById('toggle-show-syllables').checked;
        const colorBefore = doc.getElementById('toggle-color-syllables').checked;
        choose('sounds');
        assert(content().querySelector('.sound') !== null, 'Klankmodus werkt met lettergreeptonen uitgeschakeld');
        choose('syllables');
        assert(doc.getElementById('toggle-show-syllables').checked === showBefore &&
          doc.getElementById('toggle-color-syllables').checked === colorBefore,
          'Lettergreepvoorkeuren blijven bewaard tijdens wisselen');
        choose('sounds');
        assert(JSON.parse(localStorage.getItem(keys[0])).readingMode === 'sounds', 'Keuze wordt opgeslagen in localStorage');
        app = await loadApp();
        doc = app.document;
        assert(isMode(doc, 'sounds') &&
          doc.body.classList.contains('sound-mode'), 'Klankmodus wordt hersteld na herladen');
        app.LeesBlokjes.renderBlocks(['meeuw']);
        assert(doc.querySelector('.sound-dots').textContent === 'eeuw', 'Nieuwe uitvoer gebruikt de herstelde modus');
        doc.getElementById('btn-reset-profile').click();
        assert(isMode(doc, 'syllables') &&
          !doc.querySelector('.blokje-content .sound'), 'Profiel herstellen schakelt bestaande uitvoer terug');
        localStorage.setItem(keys[0], JSON.stringify({ showSyllables: false, colorSyllables: false, theme: 'groen' }));
        app = await loadApp();
        assert(isMode(app.document, 'syllables') &&
          !app.document.getElementById('toggle-show-syllables').checked,
          'Oude profielen zonder leesmodus behouden lettergreepinstellingen');
        localStorage.removeItem(keys[0]);
        localStorage.setItem(keys[1], JSON.stringify({ showSyllables: false, colorSyllables: false }));
        app = await loadApp();
        assert(isMode(app.document, 'syllables') &&
          JSON.parse(localStorage.getItem(keys[0])).readingMode === 'syllables',
          'Migratie van oude instellingen bewaart de standaardmodus');
        for (const source of ['doc', 'web', 'bookmarklet', 'text']) {
          app.document.getElementById(`tab-btn-${source}`).click();
          app = await loadApp();
          assert(app.LeesBlokjes.getActiveImportSection() === source &&
            app.document.querySelectorAll('.import-panel:not([hidden])').length === 1,
            `Laatste bron wordt hersteld na herladen: ${source}`);
        }
        localStorage.setItem(keys[2], 'none');
        app = await loadApp();
        assert(app.LeesBlokjes.getActiveImportSection() === 'text', 'Oude ingeklapte accordeonstatus opent tekst plakken');
        localStorage.setItem(keys[2], 'ongeldig');
        app = await loadApp();
        assert(app.LeesBlokjes.getActiveImportSection() === 'text', 'Onbekende opgeslagen bron opent tekst plakken');
        const originalFetch = app.LeesBlokjes.WebpageProcessor.fetchAndExtract;
        try {
          app.LeesBlokjes.WebpageProcessor.fetchAndExtract = async url => ({
            text: 'school nieuws leeuw', title: 'Dolfijnen (Wikipedia)', url, wordCount: 3
          });
          app.document.querySelector('[data-reading-mode="sounds"]').click();
          app.document.querySelector('.web-suggestions [data-url]').click();
          await new Promise(resolve => app.setTimeout(resolve, 0));
          assert(app.document.getElementById('web-url-input').value === 'https://nl.wikipedia.org/wiki/Dolfijnen',
            'Voorbeeldknop vult de juiste Wikipedia-link in');
          assert(app.document.querySelectorAll('.blokje-content .sound-word').length === 3 &&
            app.document.getElementById('web-success').style.display === 'flex',
            'Webimport bouwt gekleurde klankuitvoer op en toont succes');
          app.document.getElementById('tab-btn-text').click();
          assert(app.document.getElementById('text-input').value === 'school nieuws leeuw',
            'Bronwissel behoudt geimporteerde tekst');
          app.document.getElementById('tab-btn-web').click();
          assert(app.document.getElementById('web-success').style.display === 'flex',
            'Bronwissel behoudt webimportstatus');
        } finally {
          app.LeesBlokjes.WebpageProcessor.fetchAndExtract = originalFetch;
        }
        doc = app.document;
        const chooseLayout = layout => doc.querySelector(`[data-reading-layout="${layout}"]`).click();
        const setSpacing = value => {
          doc.getElementById('profile-word-spacing').value = value;
          doc.getElementById('profile-word-spacing').dispatchEvent(new app.Event('input'));
        };
        assert(doc.getElementById('profile-line-height').closest('.profile-item').nextElementSibling
          .contains(doc.getElementById('profile-word-spacing')),
          'Woordafstand staat direct onder Regelafstand');
        assert(!doc.querySelector('.profile-grid .profile-label-hint'),
          'Verklarende teksten zijn verwijderd uit de compacte instellingen');
        const badge = app.getComputedStyle(doc.getElementById('val-word-spacing'));
        const lineBadge = app.getComputedStyle(doc.getElementById('val-line-height'));
        assert(badge.backgroundColor === lineBadge.backgroundColor &&
          badge.fontSize === lineBadge.fontSize && badge.borderRadius === lineBadge.borderRadius,
          'Woordafstand heeft dezelfde blauwe badge en typografie als Regelafstand');
        assert(doc.querySelector('[data-reading-layout="blocks"]').getAttribute('aria-pressed') === 'true',
          'Alineablokken blijft de standaardweergave');
        for (const layout of ['blocks', 'continuous']) {
          chooseLayout(layout);
          for (const mode of ['normal', 'syllables', 'sounds']) {
            doc.getElementById('text-input').value = mode === 'sounds' ? 'school school' : 'Nederland Nederland';
            choose(mode === 'sounds' ? 'sounds' : 'syllables');
            const toggle = doc.getElementById('toggle-show-syllables');
            toggle.checked = mode !== 'normal';
            toggle.dispatchEvent(new app.Event('change'));
            setSpacing('0.8');
            const output = content();
            const firstWord = output.querySelector(mode === 'sounds' ? '.sound-word' : '.syl-word');
            const secondWord = firstWord.nextElementSibling;
            const wordGap = () => {
              const first = doc.createRange();
              const second = doc.createRange();
              first.selectNodeContents(firstWord);
              second.selectNodeContents(secondWord);
              return second.getBoundingClientRect().left - first.getBoundingClientRect().right;
            };
            const narrow = wordGap();
            const groupWidth = firstWord.firstElementChild.getBoundingClientRect().width;
            setSpacing('3.0');
            const wide = wordGap();
            assert(wide - narrow > 10, `Woordafstand vergroot de gemeten ruimte direct in ${mode}/${layout}`);
            assert(content() === output, `Woordafstand verwerkt de tekst niet opnieuw in ${mode}/${layout}`);
            assert(firstWord.firstElementChild.getBoundingClientRect().width === groupWidth,
              `Woordafstand verandert de bouwstenen niet in ${mode}/${layout}`);
            assert(doc.getElementById('val-word-spacing').textContent === '3.0×',
              `Woordafstandbadge volgt de slider in ${mode}/${layout}`);
          }
        }
        chooseLayout('blocks');
        setSpacing('1.0');
        const flowingText = 'school schrijfboek nieuws leeuw vriendelijk ruimteschip\n' +
          'aai ooi oei eeuw ieuw uw.\n\nTweede alinea. Nog een zin. Derde zin. Vierde zin. Vijfde zin.';
        doc.getElementById('text-input').value = flowingText;
        choose('sounds');
        const blockHtml = doc.getElementById('output-area').innerHTML;
        const blockTexts = Array.from(doc.querySelectorAll('.lees-blokje')).map(block => block.dataset.originalText);
        assert(blockTexts.length > 1, 'Controle-invoer bevat meerdere alineablokken');
        // Een weergavewissel mag niet de nog niet verwerkte invoer gebruiken.
        doc.getElementById('text-input').value = 'Onverwerkte wijziging';
        chooseLayout('continuous');
        assert(!doc.querySelector('.lees-blokje') && !doc.querySelector('.blokje-badge') &&
          doc.querySelectorAll('.continuous-reading').length === 1,
          'Doorlopende tekst bevat geen genummerde blokkaarten');
        assert(content().textContent === flowingText &&
          app.getComputedStyle(content()).whiteSpace === 'pre-wrap',
          'Doorlopende tekst behoudt de volledige originele tekst en alineagrenzen');
        assert(doc.querySelectorAll('[data-reading-layout][aria-pressed="true"]').length === 1 &&
          doc.getElementById('focus-tip').style.display === 'none',
          'Tekstweergaven zijn exclusief en de bloktip is verborgen bij doorlopende tekst');
        const expectedColors = {
          blue: 'rgb(73, 181, 229)', green: 'rgb(145, 184, 76)', yellow: 'rgb(244, 221, 39)',
          orange: 'rgb(239, 117, 69)', white: 'rgb(255, 255, 255)'
        };
        for (const [color, expected] of Object.entries(expectedColors)) {
          const group = content().querySelector(`.sound-${color}`);
          assert(group && app.getComputedStyle(group).backgroundColor === expected,
            `Exacte zichtbare leeskaartkleur in doorlopende tekst: ${color}`);
        }
        for (const word of ['aai', 'ooi', 'oei']) {
          const group = Array.from(content().querySelectorAll('.sound-underline'))
            .find(group => group.textContent === word);
          const style = app.getComputedStyle(group, '::after');
          assert(style.content !== 'none' && parseFloat(style.borderTopWidth) > 0 &&
            parseFloat(style.borderBottomWidth) > 0,
            `Dubbele onderstreping zichtbaar in doorlopende tekst: ${word}`);
        }
        for (const word of ['eeuw', 'ieuw', 'uw']) {
          const group = Array.from(content().querySelectorAll('.sound-dots'))
            .find(group => group.textContent === word);
          assert(group && group.querySelectorAll('.sound-letter').length === word.length &&
            Array.from(group.querySelectorAll('.sound-letter')).every(letter =>
              app.getComputedStyle(letter, '::after').content !== 'none'),
            `Punt onder elke letter in doorlopende tekst: ${word}`);
        }
        const clipboard = app.navigator.clipboard;
        const writeDescriptor = Object.getOwnPropertyDescriptor(clipboard, 'writeText');
        let copied = '';
        Object.defineProperty(clipboard, 'writeText', { configurable: true, value: async text => { copied = text; } });
        try {
          doc.getElementById('btn-copy').click();
          await new Promise(resolve => app.setTimeout(resolve, 0));
          assert(copied === flowingText, "Kopieren van doorlopende tekst behoudt alinea's zonder bloknummers");
          chooseLayout('blocks');
          assert(doc.getElementById('output-area').innerHTML === blockHtml,
            'Terugwisselen herstelt exact de bestaande blokken zonder herverwerking');
          doc.getElementById('btn-copy').click();
          await new Promise(resolve => app.setTimeout(resolve, 0));
          assert(copied === blockTexts.map((text, i) => `[Blokje ${i + 1}]\n${text}`).join('\n\n'),
            'Kopieren van alineablokken behoudt bestaande bloknummers');
        } finally {
          if (writeDescriptor) Object.defineProperty(clipboard, 'writeText', writeDescriptor);
          else delete clipboard.writeText;
        }
        const speech = app.speechSynthesis;
        const speechKeys = ['speak', 'cancel', 'getVoices', 'speaking'];
        const speechDescriptors = speechKeys.map(key => Object.getOwnPropertyDescriptor(speech, key));
        let speaking = false;
        let cancelled = 0;
        const spoken = [];
        Object.defineProperties(speech, {
          speak: { configurable: true, value: utterance => { speaking = true; spoken.push(utterance); } },
          cancel: { configurable: true, value: () => { speaking = false; cancelled++; } },
          getVoices: { configurable: true, value: () => [] },
          speaking: { configurable: true, get: () => speaking }
        });
        try {
          chooseLayout('continuous');
          doc.getElementById('btn-read-all').click();
          assert(spoken.length === 1 && spoken[0].text === flowingText &&
            doc.getElementById('btn-stop-audio').style.display === 'inline-flex',
            'Alles voorlezen leest de volledige doorlopende tekst zonder klankscheidingen');
          doc.getElementById('btn-stop-audio').click();
          assert(cancelled === 1 && !speaking &&
            doc.getElementById('btn-read-all').style.display === 'inline-flex',
            'Stoppen werkt in doorlopende tekst');
          doc.getElementById('btn-read-all').click();
          const interrupted = spoken[spoken.length - 1];
          chooseLayout('blocks');
          assert(cancelled === 2 && !speaking, 'Weergavewissel stopt lopende audio');
          doc.querySelector('.btn-speak-block').click();
          assert(spoken[spoken.length - 1].text === blockTexts[0],
            'Los blok voorlezen blijft werken na terugwisselen');
          interrupted.onend();
          assert(speaking && cancelled === 2,
            'Vertraagd audio-einde van vorige weergave onderbreekt nieuwe audio niet');
          doc.getElementById('btn-stop-audio').click();
        } finally {
          speechKeys.forEach((key, index) => {
            if (speechDescriptors[index]) Object.defineProperty(speech, key, speechDescriptors[index]);
            else delete speech[key];
          });
        }
        doc.getElementById('text-input').value = flowingText;
        chooseLayout('continuous');
        choose('syllables');
        assert(doc.querySelector('.continuous-reading .syl') && !content().querySelector('.sound'),
          'Lettergrepen werken ook in doorlopende tekst');
        choose('sounds');
        setSpacing('2.4');
        const stored = JSON.parse(localStorage.getItem(keys[0]));
        assert(stored.wordSpacing === 2.4 && stored.readingLayout === 'continuous',
          'Woordafstand en tekstweergave worden opgeslagen in localStorage');
        app = await loadApp();
        doc = app.document;
        assert(doc.getElementById('profile-word-spacing').value === '2.4' &&
          doc.getElementById('val-word-spacing').textContent === '2.4×' &&
          doc.querySelector('[data-reading-layout="continuous"]').getAttribute('aria-pressed') === 'true',
          'Woordafstand en doorlopende tekst worden hersteld na herladen');
        app.LeesBlokjes.renderBlocks(['school', 'nieuws']);
        assert(!doc.querySelector('.lees-blokje') && content().textContent === 'school\n\nnieuws',
          'Nieuwe uitvoer gebruikt de opgeslagen doorlopende tekstweergave');
        doc.getElementById('btn-reset-profile').click();
        assert(Number(doc.getElementById('profile-word-spacing').value) === 1 &&
          doc.querySelectorAll('.lees-blokje').length === 2 &&
          doc.querySelector('[data-reading-layout="blocks"]').getAttribute('aria-pressed') === 'true',
          'Profielherstel reset woordafstand en herstelt alineablokken direct');
        app.LeesBlokjes.applyProfile({ ...stored, wordSpacing: 99 });
        assert(Number(doc.getElementById('profile-word-spacing').value) === 3, 'Woordafstand is begrensd op 3.0');
        app.LeesBlokjes.applyProfile({ ...stored, wordSpacing: 0.1 });
        assert(doc.getElementById('profile-word-spacing').value === '0.8', 'Woordafstand is begrensd op 0.8');
        localStorage.setItem(keys[0], JSON.stringify({ readingMode: 'sounds', showSyllables: true, colorSyllables: true }));
        app = await loadApp();
        doc = app.document;
        assert(Number(doc.getElementById('profile-word-spacing').value) === 1 &&
          doc.querySelector('[data-reading-layout="blocks"]').getAttribute('aria-pressed') === 'true',
          'Bestaande profielen krijgen standaard woordafstand en alineablokken');
        app.document.getElementById('text-input').value = requiredExamples.map(([word]) => word).join(' ');
        app.document.querySelector('[data-reading-mode="sounds"]').click();
        app.document.getElementById('tab-btn-text').click();
        for (const width of [320, 390]) {
          frame.style.width = `${width}px`;
          await new Promise(resolve => app.requestAnimationFrame(resolve));
          const output = app.document.querySelector('.blokje-content');
          assert(app.document.documentElement.scrollWidth <= app.innerWidth &&
            Array.from(doc.querySelectorAll('.import-source-button'))
              .every(button => button.scrollWidth <= button.clientWidth) &&
            Array.from(output.querySelectorAll('.sound-word')).every(word => word.scrollWidth <= output.clientWidth + 1),
            `Klankbouwstenen en navigatie passen zonder horizontale overflow op ${width}px`);
        }
        frame.style.width = '1366px';
        frame.style.height = '768px';
        await new Promise(resolve => app.requestAnimationFrame(resolve));
        const sidebarRect = doc.querySelector('.sidebar-column').getBoundingClientRect();
        const contentRect = doc.querySelector('.content-column').getBoundingClientRect();
        assert(contentRect.left >= sidebarRect.right && doc.documentElement.scrollWidth <= app.innerWidth,
          'Laptopweergave houdt de compacte instellingen naast de leestekst zonder overflow');
        const inputRect = doc.querySelector('.input-card').getBoundingClientRect();
        const outputRect = doc.querySelector('.output-card').getBoundingClientRect();
        const headerRect = doc.querySelector('.app-header').getBoundingClientRect();
        assert(headerRect.height + inputRect.height + (outputRect.top - inputRect.bottom) < app.innerHeight - 100,
          'Op een laptop van 1366x768 blijft uitvoerruimte zichtbaar onder de compacte invoer');
        frame.style.width = '100%';
        frame.style.height = '800px';
        results.textContent = `${checks.join('\n')}\n\n${checks.length} tests geslaagd.`;
        results.dataset.status = 'passed';
      } catch (error) {
        results.textContent = `${checks.join('\n')}\nFAIL: ${error.stack}`;
        results.dataset.status = 'failed';
      } finally {
        keys.forEach((key, index) => {
          if (saved[index] === null) localStorage.removeItem(key);
          else localStorage.setItem(key, saved[index]);
        });
      }
    })();
  </script>
</body>
</html>
